<div class="screen-content">
    <h2>ジャンル管理</h2>
    <div id="admin-genres-feedback" class="batch-status-banner info page-feedback" hidden></div>

    <div class="form-group">
        <label>新規追加</label>
        <div class="input-with-btn">
            <input type="text" id="new-genre-name" placeholder="ジャンル名 (例: 消耗品)">
            <input type="text" id="new-genre-code" class="w-100px" placeholder="コード (例: SUP)">
            <button id="admin-genre-add-btn" class="primary-btn" onclick="AdminController.addGenre()">追加</button>
        </div>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>名称</th>
                <th>コード</th>
                <th>状態</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="genre-list-body"></tbody>
    </table>
    
    <div class="nav-buttons">
        <button id="admin-genres-back-btn" class="back-btn" onclick="Router.to('admin-main')">戻る</button>
    </div>
</div>
