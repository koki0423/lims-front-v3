<div class="screen-content">
    <h2>管理者追加登録画面</h2>

    <div id="admin-register-feedback" class="batch-status-banner info page-feedback" hidden></div>

    <form id="form-admin-reg">
        <div class="form-group">
            <label>学籍番号 (NFC入力のみ)</label>
            <div class="input-with-btn">
                <!-- 本番運用ではinputをreadonlyにする -->
                <input type="text" name="adminId" id="admin-id" placeholder="スキャンしてください" required
                    class="readonly-input">
                <button type="button" class="nfc-btn" onclick="AdminController.NfcRead()">NFCで入力</button>
            </div>
        </div>
        <div class="form-group">
            <label>パスワード</label>
            <input type="password" name="password" required>
        </div>
    </form>

    <div class="nav-buttons">
        <button id="admin-register-back-btn" class="back-btn" onclick="Router.to('admin-main')">戻る</button>
        <button id="admin-register-submit-btn" class="primary-btn" onclick="AdminController.submitRegister()">登録実行</button>
    </div>
</div>
