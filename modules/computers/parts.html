<div class="screen-content">
    <h2>計算機管理 > 計算機部品管理</h2>

    <div class="registration-page-lead">
        管理番号から既存の部品備品を読み込み、部品仕様と使用状態を管理します。部品備品自体は先に通常の備品登録で作成しておいてください。
    </div>

    <div class="form-group registration-section-card">
        <label>対象部品の読み込み</label>
        <div class="input-with-btn registration-search-row">
            <input type="text" id="computer-part-mgmt-input" placeholder="部品の管理番号を入力">
            <button type="button" class="primary-btn" onclick="ComputerController.loadComputerPartAsset()">備品を読み込む</button>
            <button type="button" class="secondary-btn" onclick="ComputerController.resetComputerPart()">クリア</button>
        </div>
        <div id="computer-part-status" class="mt-12"></div>
        <div id="computer-part-summary" class="mt-12"></div>
    </div>

    <div class="form-group registration-section-card">
        <label>計算機部品情報</label>
        <div class="simple-common-grid computer-form-grid">
            <!-- <div class="registration-grid-full">
                <label for="computer-part-active-type">現在の部品種別</label>
                <input type="text" id="computer-part-active-type" class="readonly-input" readonly>
                <p class="registration-sub-note">
                    構成履歴のアクティブ構成から算出した表示です。種別の変更は構成履歴管理で行ってください。
                </p>
            </div> -->
            <div>
                <label for="computer-part-usage-status">使用状態</label>
                <select id="computer-part-usage-status"></select>
            </div>
            <div class="registration-grid-full">
                <label for="computer-part-spec">部品仕様</label>
                <input type="text" id="computer-part-spec" placeholder="例: 8GB GDDR6">
            </div>
            <div class="registration-grid-full">
                <label for="computer-part-note">備考</label>
                <textarea id="computer-part-note" rows="3" placeholder="任意"></textarea>
            </div>
        </div>
    </div>

    <div class="nav-buttons registration-nav-buttons">
        <button class="back-btn" onclick="Router.to('computer-main')">戻る</button>
        <button class="primary-btn" id="computer-part-save-btn" onclick="ComputerController.saveComputerPart()">登録する</button>
    </div>
</div>
