<div class="screen-content">
    <h2>廃棄履歴</h2>
    <div class="history-summary-grid">
        <div class="batch-summary-card">
            <span>総件数</span>
            <strong id="disposal-history-total">-</strong>
        </div>
        <div class="batch-summary-card">
            <span>現在ページ</span>
            <strong id="disposal-history-page">-</strong>
        </div>
        <div class="batch-summary-card">
            <span>表示範囲</span>
            <strong id="disposal-history-range">-</strong>
        </div>
    </div>

    <div class="history-filter-toggle-row">
        <button type="button" id="disposal-history-query-toggle-btn" class="back-btn" aria-expanded="false" onclick="DisposalController.toggleHistoryFilters()">
            絞り込み条件を開く
        </button>
    </div>

    <form id="disposal-history-query-form" class="history-filter-panel" onsubmit="event.preventDefault(); DisposalController.applyHistoryFilters();" hidden>
        <div class="history-filter-grid">
            <div class="form-group">
                <label for="disposal-history-query-mgmt">備品番号</label>
                <input type="text" id="disposal-history-query-mgmt" placeholder="例: PC-0001">
            </div>
            <div class="form-group">
                <label for="disposal-history-query-name">備品名</label>
                <input type="text" id="disposal-history-query-name" placeholder="例: ノートPC">
            </div>
            <div class="form-group">
                <label for="disposal-history-query-operator">担当者</label>
                <input type="text" id="disposal-history-query-operator" placeholder="例: 24A1234">
            </div>
            <div class="form-group">
                <label for="disposal-history-date-from">廃棄日 From</label>
                <input type="date" id="disposal-history-date-from">
            </div>
            <div class="form-group">
                <label for="disposal-history-date-to">廃棄日 To</label>
                <input type="date" id="disposal-history-date-to">
            </div>
        </div>
        <div class="history-filter-actions">
            <button type="button" id="disposal-history-clear-btn" class="back-btn" onclick="DisposalController.clearHistoryFilters()">条件クリア</button>
            <button type="submit" id="disposal-history-apply-btn" class="primary-btn">絞り込む</button>
        </div>
    </form>

    <div class="history-toolbar">
        <div class="rows-per-page history-rows-per-page">
            <label for="disposal-history-per-page">表示件数</label>
            <select id="disposal-history-per-page" onchange="DisposalController.changePerPage(this.value)">
                <option value="10">10件</option>
                <option value="20" selected>20件</option>
                <option value="50">50件</option>
            </select>
        </div>
        <div id="disposal-history-pagination" class="pagination-controls history-pagination"></div>
    </div>

    <div id="disposal-history-status" class="batch-status-banner info">履歴を読み込んでいます。</div>

    <div class="history-list-shell history-table-shell">
        <div id="disposal-history-list" class="history-record-table-host"></div>
    </div>

    <div class="nav-buttons">
        <button class="back-btn" onclick="Router.back('disposal-top')">戻る</button>
    </div>
</div>

<div id="disposal-history-detail-modal" class="modal-overlay" hidden>
    <div class="modal-window history-detail-modal-window">
        <h3 id="disposal-history-detail-title">廃棄履歴詳細</h3>
        <div id="disposal-history-detail-content"></div>
        <div class="modal-buttons">
            <button type="button" id="disposal-history-detail-close-btn" class="back-btn" onclick="DisposalController.closeHistoryDetail()">閉じる</button>
        </div>
    </div>
</div>
