<div class="screen-content">
    <h2>廃棄履歴</h2>
    <div class="registration-page-lead history-page-lead">
        廃棄済みの履歴を参照します。表示件数の切替とページ移動で過去の記録を確認できます。
    </div>

    <div class="history-summary-grid">
        <div class="batch-summary-card">
            <span>総件数</span>
            <strong id="disposal-history-total">-</strong>
        </div>
        <div class="batch-summary-card">
            <span>現在ページ</span>
            <strong id="disposal-history-page">-</strong>
        </div>
        <div class="batch-summary-card">
            <span>表示範囲</span>
            <strong id="disposal-history-range">-</strong>
        </div>
    </div>

    <div class="history-toolbar">
        <div class="rows-per-page history-rows-per-page">
            <label for="disposal-history-per-page">表示件数</label>
            <select id="disposal-history-per-page" onchange="DisposalController.changePerPage(this.value)">
                <option value="10">10件</option>
                <option value="20" selected>20件</option>
                <option value="50">50件</option>
            </select>
        </div>
        <div id="disposal-history-pagination" class="pagination-controls history-pagination"></div>
    </div>

    <div id="disposal-history-status" class="batch-status-banner info">履歴を読み込んでいます。</div>

    <div class="history-list-shell history-table-shell">
        <div id="disposal-history-list" class="history-record-table-host"></div>
    </div>

    <div class="nav-buttons">
        <button class="back-btn" onclick="Router.to('disposal-top')">戻る</button>
    </div>
</div>
