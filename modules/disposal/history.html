<div class="screen-content">
    <h2>廃棄履歴一覧</h2>

    <div style="padding: 10px; border-radius: 4px;">
        <div class="pagination-container">
            <div class="rows-per-page">
                <label>表示件数:</label>
                <select onchange="DisposalController.changePerPage(this.value)">
                    <option value="10">10件</option>
                    <option value="20" selected>20件</option>
                    <option value="50">50件</option>
                </select>
            </div>
            <div id="pagination-controls" class="pagination-controls"></div>
        </div>

        <table class="data-table" style="width: 100%;">
            <thead>
                <tr>
                    <th>廃棄日時</th>
                    <th>管理番号</th>
                    <th>数量</th>
                    <th>廃棄理由</th>
                    <th>担当者</th>
                </tr>
            </thead>
            <tbody id="disposal-history-body"></tbody>
        </table>

        <div id="loading-spinner" style="display:none; text-align:center; padding:20px;">読み込み中...</div>
    </div>

    <div class="nav-buttons">
        <button class="back-btn" onclick="Router.to('disposal-top')">戻る</button>
    </div>
</div>
