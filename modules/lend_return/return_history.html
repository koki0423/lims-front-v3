<div class="screen-content">
    <h2>返却履歴</h2>
    <div class="pagination-container">
        <div class="rows-per-page">
            <label>表示件数:</label>
            <select onchange="LendReturnController.changeReturnHistoryPerPage(this.value)">
                <option value="10">10件</option>
                <option value="20" selected>20件</option>
                <option value="50">50件</option>
                <option value="100">100件</option>
            </select>
        </div>

        <div id="return-history-pagination" class="pagination-controls"></div>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>備品番号</th>
                <th>数量</th>
                <th>貸出先</th>
                <th>登録日</th>
                <th>返却日</th>
            </tr>
        </thead>
        <tbody id="return-history-body">
        </tbody>
    </table>

    <div
        style="margin-top:10px; border-top:1px solid #eee; height:200px; background:repeating-linear-gradient(to bottom, transparent 0, transparent 29px, #eee 30px);">
    </div>

    <div class="nav-buttons">
        <button class="back-btn" onclick="Router.to('return-menu')">戻る</button>
    </div>
</div>
