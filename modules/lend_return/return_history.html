<div class="screen-content">
    <h2>返却履歴</h2>
    <div class="registration-page-lead history-page-lead">
        返却済みの履歴を参照します。貸出日と返却日の流れを一覧で確認できます。
    </div>

    <div class="history-summary-grid">
        <div class="batch-summary-card">
            <span>総件数</span>
            <strong id="return-history-total">-</strong>
        </div>
        <div class="batch-summary-card">
            <span>現在ページ</span>
            <strong id="return-history-page">-</strong>
        </div>
        <div class="batch-summary-card">
            <span>表示範囲</span>
            <strong id="return-history-range">-</strong>
        </div>
    </div>

    <div class="history-toolbar">
        <div class="rows-per-page history-rows-per-page">
            <label for="return-history-per-page">表示件数</label>
            <select id="return-history-per-page" onchange="LendReturnController.changeReturnHistoryPerPage(this.value)">
                <option value="10">10件</option>
                <option value="20" selected>20件</option>
                <option value="50">50件</option>
                <option value="100">100件</option>
            </select>
        </div>
        <div id="return-history-pagination" class="pagination-controls history-pagination"></div>
    </div>

    <div id="return-history-status" class="batch-status-banner info">履歴を読み込んでいます。</div>

    <div class="history-list-shell history-table-shell">
        <div id="return-history-list" class="history-record-table-host"></div>
    </div>

    <div class="nav-buttons">
        <button class="back-btn" onclick="Router.back('return-menu')">戻る</button>
    </div>
</div>
