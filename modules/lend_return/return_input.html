<div class="screen-content">
    <h2>返却登録</h2>
    <div class="screen-tools-stack">
        <div id="return-input-feedback" class="batch-status-banner info page-feedback" hidden></div>
        <div id="return-device-status"></div>
    </div>
    <form id="form-return">
        <div class="form-group">
            <label>貸出番号 (編集不可)</label>
            <input type="text" id="disp-lending-id" disabled>
        </div>
        <div class="form-group">
            <label>備品番号</label>
            <input type="text" id="disp-management-number" readonly class="readonly-input">
        </div>
        <div class="form-group">
            <label>備品名</label>
            <input type="text" id="disp-asset-name" readonly class="readonly-input">
        </div>
        <div class="form-group">
            <label>シリアル番号</label>
            <input type="text" id="disp-serial" readonly class="readonly-input">
        </div>
        <div class="form-group">
            <label>数量</label>
            <input type="number" id="disp-qty" disabled>
        </div>
        <div class="form-group">
            <label>貸出先</label>
            <input type="text" id="disp-borrower" disabled>
        </div>

        <div class="form-group">
            <label>返却日</label>
            <input type="date" name="returnDate" required>
        </div>
        <div class="form-group">
            <label>返却実行者</label>
            <div class="input-with-btn">
                <input type="text" name="returner" placeholder="例:AB12345" required>
                <button type="button" class="nfc-btn" onclick="LendReturnController.NfcRead('returner')">NFC入力</button>
            </div>
        </div>
    </form>
    <div class="nav-buttons">
        <button class="back-btn" onclick="Router.to('return-search')">戻る</button>
        <button class="next-btn" onclick="LendReturnController.saveReturnInput()">次へ</button>
    </div>
</div>
