<div class="screen-content">
    <h2>新規登録 > 管理方法選択 > まとめて登録 > CSVファイルから登録</h2>
    <div class="form-group">
        <div class="mb-10">
            <button type="button" class="secondary-btn" onclick="RegController.downloadBatchTemplate()">
                テンプレートをダウンロード
            </button>
        </div>
        <div class="content-note content-note-small mt-8">
            説明書はExcel形式、入力用テンプレートはCSV形式でダウンロードされます。CSVに入力してそのままアップロードしてください。
        </div>
        <label>CSVファイルを選択</label>
        <div class="input-file">
            <input type="file" id="file-csv" name="file-csv" accept=".csv" />
        </div>
    </div>
    <div class="form-group">
        <label>ラベル設定</label>
        <div class="info-row">
            <span class="info-label">コード種別</span>
            <select id="labelCodeType" name="labelCodeType">
                <option value="QR" selected>QRコード</option>
                <option value="CODE128">バーコード(Code128)</option>
            </select>
        </div>
        <div class="info-row mt-8">
            <span class="info-label">テープ幅</span>
            <select id="labelTapeWidth" name="labelTapeWidth">
                <option value="9" selected>9 mm</option>
                <option value="12">12 mm</option>
                <option value="18">18 mm</option>
            </select>
        </div>
        <div class="info-row mt-8">
            <label>
                <input type="checkbox" id="labelHalfcut" name="labelHalfcut" checked disabled>
                ハーフカットを有効にする
            </label>
        </div>
    </div>

    <div class="form-group" id="batch-preview-section">
        <label>登録前プレビュー</label>
        <div id="batch-preview-status"></div>
        <div id="batch-preview-summary" class="mt-12"></div>
        <div id="batch-preview-issues" class="mt-12"></div>
        <div id="batch-preview-table" class="mt-12"></div>
    </div>

    <div class="nav-buttons nav-buttons-spacious">
        <button class="back-btn" onclick="Router.to('reg-batch-select')">戻る</button>
        <button type="button" class="secondary-btn" id="batch-reset-btn" onclick="RegController.resetBatchPreview()">クリア</button>
        <button type="button" class="secondary-btn" id="batch-preview-btn" onclick="RegController.prepareBatchPreview()">プレビューを作成</button>
        <button class="primary-btn" id="batch-commit-btn" onclick="RegController.commitBatchImport()">登録を確定</button>
    </div>
</div>
