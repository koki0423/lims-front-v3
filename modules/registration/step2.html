<div class="screen-content">
    <h2>新規登録 > 管理方法選択 > 入力①</h2>
    <form id="form-reg-1">
        <div class="form-group">
            <label>備品名*</label>
            <input type="text" name="itemName" placeholder="例:ノートパソコン" required>
        </div>
        <div class="form-group">
            <label>メーカー*</label>
            <input type="text" name="maker" placeholder="例:Apple" required>
        </div>
        <div class="form-group">
            <label>型番</label>
            <input type="text" name="model" placeholder="例:MacBookAir">
        </div>

        <div class="form-group" id="group-serial">
            <label>シリアル番号*</label>
            <input type="text" name="serial" placeholder="例:W8009JEE5PC">
        </div>

        <div class="form-group" id="group-quantity" style="display:none;">
            <label>数量*</label>
            <input type="number" name="quantity" value="1" min="1" placeholder="例: 10">
        </div>

        <div class="form-group">
            <label>備品ジャンル</label>
            <select name="genre" id="reg-genre-select" required>
                <option value="">選択してください</option>
            </select>
        </div>
    </form>

    <div class="nav-buttons">
        <button class="back-btn" onclick="Router.to('reg-select')">戻る</button>
        <button class="next-btn" onclick="RegController.saveStep1()">次へ</button>
    </div>
</div>
