<div class="screen-content">
    <h2>OR 検索: 備品番号 または 備品名のどちらかを入力してください</h2>
    <div class="screen-tools-stack">
        <div id="search-feedback" class="batch-status-banner info page-feedback" hidden></div>
        <div id="search-asset-preview"></div>
    </div>
    <div class="form-group">
        <label>備品番号</label>
        <div class="input-with-btn">
            <input type="text" name="itemId" placeholder="例:OFS-20251101-0001" required>
        </div>
    </div>

    <div class="form-group mt-20">
        <label>備品名（部分一致）</label>
        <input type="text" id="search-name" class="input-lg" placeholder="例: MacBook / オシロスコープ">
    </div>

    <div class="nav-buttons nav-buttons-spacious">
        <button id="search-back-btn" class="back-btn" onclick="Router.back('main-menu')">戻る</button>
        <button id="search-submit-btn" class="primary-btn" onclick="SearchController.performSearch()">検索</button>
    </div>
</div>
