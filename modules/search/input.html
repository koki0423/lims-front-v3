<div class="screen-content">
    <h2>OR 検索: 備品番号 または 備品名のどちらかを入力してください</h2>
    <div class="form-group">
        <label>備品番号</label>
        <div class="input-with-btn">
            <input type="text" name="itemId" placeholder="例:OFS-20251101-0001" required>
        </div>
    </div>

    <div class="form-group" style="margin-top: 20px;">
        <label>備品名（部分一致）</label>
        <input type="text" id="search-name" placeholder="例: MacBook / オシロスコープ" style="padding: 15px;">
    </div>

    <div class="nav-buttons" style="margin-top: 60px;">
        <button class="back-btn" onclick="Router.to('main-menu')">戻る</button>
        <button class="primary-btn" onclick="SearchController.performSearch()">検索</button>
    </div>
</div>
