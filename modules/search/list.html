<div class="screen-content">
    <h2>検索結果: 候補一覧</h2>
    <p>条件に一致する備品が複数見つかりました。</p>
    <div id="search-list-feedback" class="batch-status-banner info page-feedback" hidden></div>
    <div class="list-state-panel">
        <div id="search-list-summary" class="list-state-summary">-</div>
        <div id="search-list-condition-chips" class="list-condition-chips"></div>
        <div class="list-condition-actions">
            <button type="button" id="search-list-clear-btn" class="back-btn" onclick="SearchController.clearListConditions()">条件クリア</button>
        </div>
    </div>
    <div id="search-list-filter-controls" class="filters-container">
        <label>絞り込み:</label>
        <button class="filter-btn" data-status="1" onclick="SearchController.toggleFilter('1')">正常</button>
        <button class="filter-btn" data-status="2" onclick="SearchController.toggleFilter('2')">故障</button>
        <button class="filter-btn" data-status="3" onclick="SearchController.toggleFilter('3')">修理中</button>
        <button class="filter-btn" data-status="4" onclick="SearchController.toggleFilter('4')">貸出中</button>
        <button class="filter-btn" data-status="5" onclick="SearchController.toggleFilter('5')">廃棄済み</button>
        <button class="filter-btn" data-status="6" onclick="SearchController.toggleFilter('6')">紛失</button>
    </div>
    <div class="panel-scroll">
        <table class="data-table table-min-600">
            <thead>
                <tr>
                    <th class="sort-header" data-key="mgmt" onclick="SearchController.sortBy('mgmt')">
                        管理番号
                    </th>
                    <th class="sort-header" data-key="name" onclick="SearchController.sortBy('name')">
                        備品名
                    </th>
                    <th class="sort-header" data-key="status" onclick="SearchController.sortBy('status')">
                        状態
                    </th>
                    <th class="sort-header" data-key="location" onclick="SearchController.sortBy('location')">
                        場所/利用者
                    </th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="search-candidates-body">
            </tbody>
        </table>
    </div>

    <div class="nav-buttons nav-buttons-compact">
        <button id="search-list-back-btn" class="back-btn" onclick="Router.to('search-top')">再検索</button>
    </div>
</div>
