<div class="screen-content">
    <h2>検索結果</h2>

    <form id="form-search-result">
        <div class="search-result-grid">
            <div>
                <div class="form-group">
                    <label>管理番号</label>
                    <input type="text" id="disp-mgmt-num" class="field-readonly-highlight" readonly>
                </div>

                <div class="form-group">
                    <label>備品名</label>
                    <input type="text" id="disp-name" class="field-readonly-soft" readonly>
                </div>
                <div class="form-group">
                    <label>メーカー</label>
                    <input type="text" id="disp-maker" class="field-readonly-soft" readonly>
                </div>
                <div class="form-group">
                    <label>型番</label>
                    <input type="text" id="disp-model" class="field-readonly-soft" readonly>
                </div>
                <div class="form-group">
                    <label>シリアル番号</label>
                    <input type="text" id="disp-serial" class="field-readonly-soft" readonly>
                </div>
            </div>

            <div>
                <div class="form-group">
                    <label>状態 (ステータス)</label>
                    <input type="text" id="disp-status" class="field-readonly-warning" readonly>
                </div>

                <div class="form-group">
                    <label>備品ジャンル</label>
                    <input type="text" id="disp-genre" class="field-readonly-soft" readonly>
                </div>
                <div class="form-group">
                    <label>現在地 / 保管場所</label>
                    <input type="text" id="disp-location" class="field-readonly-soft" readonly>
                </div>
                <div class="form-group">
                    <label>購入日</label>
                    <input type="text" id="disp-date" class="field-readonly-soft" readonly>
                </div>
                <div class="form-group">
                    <label>管理者 / 登録者</label>
                    <input type="text" id="disp-registrant" class="field-readonly-soft" readonly>
                </div>
                <div class="form-group">
                    <label>備考</label>
                    <input type="text" id="disp-remarks" class="field-readonly-soft" readonly>
                </div>
            </div>
        </div>

        <div class="nav-buttons nav-buttons-compact">
            <button type="button" class="back-btn search-back-btn" onclick="SearchController.backToSearch()">戻る</button>
        </div>
    </form>
</div>
